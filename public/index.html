<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="RS Photography - Professional automotive photography portfolio featuring exceptional car photography across Georgia and the Southeast"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>RS Photography</title>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }
      
      body:not(.site-ready) {
        overflow: hidden;
      }
      
      #root {
        width: 100%;
        height: 100%;
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        color: #4E7C8A;
        transition: opacity 0.7s ease, visibility 0.7s ease;
      }

      #boot-splash.is-leaving {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .boot-splash-inner {
        text-align: center;
        animation: bootFade 0.9s ease both;
      }

      .boot-splash-mark {
        width: 88px;
        height: 88px;
        margin: 0 auto 18px;
        border: 1px solid #4E7C8A;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 28px;
        letter-spacing: 2px;
      }

      .boot-splash-title {
        margin: 0;
        font-family: Georgia, 'Times New Roman', serif;
        font-weight: 400;
        font-size: 28px;
        letter-spacing: 2px;
      }

      .boot-splash-line {
        width: 56px;
        height: 2px;
        background: #4E7C8A;
        margin: 16px auto 0;
        opacity: 0.7;
      }

      @keyframes bootFade {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      
      @media screen and (max-width: 480px) {
        body {
          font-size: 14px;
        }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="boot-splash" aria-hidden="true">
      <div class="boot-splash-inner">
        <div class="boot-splash-mark">RS</div>
        <h1 class="boot-splash-title">RS Photography</h1>
        <div class="boot-splash-line"></div>
      </div>
    </div>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
